<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title description">
  <title id="title">DivideIT memory plan terminal screenshot</title>
  <desc id="description">Memory-aware execution profiles for the DivideIT demo GGUF model.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1440" height="820" fill="#071018"/>
  <circle cx="1270" cy="100" r="260" fill="#14b8a6" opacity=".08"/>
  <circle cx="150" cy="760" r="280" fill="#f97316" opacity=".07"/>
  <g filter="url(#shadow2)">
    <rect x="55" y="45" width="1330" height="730" rx="18" fill="url(#bg2)" stroke="#293548"/>
    <rect x="55" y="45" width="1330" height="54" rx="18" fill="#182235"/>
    <rect x="55" y="81" width="1330" height="18" fill="#182235"/>
  </g>
  <circle cx="90" cy="72" r="8" fill="#ff5f57"/>
  <circle cx="116" cy="72" r="8" fill="#febc2e"/>
  <circle cx="142" cy="72" r="8" fill="#28c840"/>
  <text x="720" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#9ca3af">divideit plan — 8 GiB budget</text>
  <g font-family="Cascadia Mono, Consolas, monospace" font-size="19" fill="#d8e2f0">
    <text x="90" y="138" fill="#7dd3fc">$ divideit plan work/divideit-demo.gguf --memory-limit 8GB</text>
    <text x="90" y="184" font-weight="700" fill="#5eead4">MEMORY PLAN</text>
    <text x="90" y="222" fill="#94a3b8">Model</text><text x="340" y="222">DivideIT Demo 7B</text>
    <text x="90" y="254" fill="#94a3b8">Architecture</text><text x="340" y="254">llama</text>
    <text x="90" y="286" fill="#94a3b8">Quantization</text><text x="340" y="286">Q4_K_M</text>
    <text x="90" y="318" fill="#94a3b8">Model size</text><text x="340" y="318">4.19 GiB</text>
    <text x="90" y="350" fill="#94a3b8">Planning budget</text><text x="340" y="350">8.00 GiB</text>
    <text x="90" y="382" fill="#94a3b8">Estimate confidence</text><text x="340" y="382" fill="#86efac">high</text>
    <text x="90" y="432" fill="#94a3b8">PROFILE</text>
    <text x="350" y="432" fill="#94a3b8">CONTEXT</text>
    <text x="520" y="432" fill="#94a3b8">BATCH</text>
    <text x="650" y="432" fill="#94a3b8">GPU LAY</text>
    <text x="820" y="432" fill="#94a3b8">EST. RAM</text>
    <text x="1010" y="432" fill="#94a3b8">EST. VRAM</text>
    <text x="1210" y="432" fill="#94a3b8">STATUS</text>
    <line x1="90" y1="450" x2="1350" y2="450" stroke="#334155"/>
    <text x="90" y="488">LOW MEMORY</text><text x="350" y="488">2048</text><text x="520" y="488">64</text><text x="650" y="488">0</text><text x="820" y="488">4.77 GiB</text><text x="1010" y="488">0 B</text><text x="1210" y="488" fill="#86efac">FITS</text>
    <text x="110" y="517" font-size="16" fill="#94a3b8">KV cache: Q4</text>
    <text x="90" y="558">BALANCED</text><text x="350" y="558">4096</text><text x="520" y="558">256</text><text x="650" y="558">0</text><text x="820" y="558">4.97 GiB</text><text x="1010" y="558">0 B</text><text x="1210" y="558" fill="#86efac">FITS</text>
    <text x="110" y="587" font-size="16" fill="#94a3b8">KV cache: Q8</text>
    <text x="90" y="628">PERFORMANCE</text><text x="350" y="628">8192</text><text x="520" y="628">512</text><text x="650" y="628">0</text><text x="820" y="628">5.69 GiB</text><text x="1010" y="628">0 B</text><text x="1210" y="628" fill="#86efac">FITS</text>
    <text x="110" y="657" font-size="16" fill="#94a3b8">KV cache: F16</text>
    <text x="90" y="711" font-weight="700" fill="#fb923c">RECOMMENDED:</text><text x="272" y="711">BALANCED profile</text>
    <text x="90" y="746" font-size="16" fill="#a5b4fc">llama-server --model "work/divideit-demo.gguf" --ctx-size 4096 --batch-size 256 ...</text>
  </g>
</svg>
