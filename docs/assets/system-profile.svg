<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title description">
  <title id="title">DivideIT system profile terminal screenshot</title>
  <desc id="description">Example output from the divideit inspect-system command.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1280" height="650" fill="#071018"/>
  <circle cx="1090" cy="75" r="210" fill="#14b8a6" opacity=".08"/>
  <circle cx="130" cy="610" r="250" fill="#f97316" opacity=".07"/>
  <g filter="url(#shadow)">
    <rect x="70" y="55" width="1140" height="540" rx="18" fill="url(#bg)" stroke="#293548"/>
    <rect x="70" y="55" width="1140" height="54" rx="18" fill="#182235"/>
    <rect x="70" y="91" width="1140" height="18" fill="#182235"/>
  </g>
  <circle cx="105" cy="82" r="8" fill="#ff5f57"/>
  <circle cx="131" cy="82" r="8" fill="#febc2e"/>
  <circle cx="157" cy="82" r="8" fill="#28c840"/>
  <text x="640" y="88" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#9ca3af">divideit inspect-system</text>
  <g font-family="Cascadia Mono, Consolas, monospace" font-size="21" fill="#d8e2f0">
    <text x="110" y="152" fill="#7dd3fc">$ divideit inspect-system</text>
    <text x="110" y="200" fill="#fb923c">____  _       _     _      ___ _____</text>
    <text x="110" y="228" fill="#fb923c">|  _ \(_)_   _(_) __| | ___|_ _|_   _|</text>
    <text x="110" y="256" fill="#fb923c">| | | | \ \ / / |/ _` |/ _ \| |  | |</text>
    <text x="110" y="284" fill="#fb923c">| |_| | |\ V /| | (_| |  __/| |  | |</text>
    <text x="110" y="312" fill="#fb923c">|____/|_| \_/ |_|\__,_|\___|___| |_|</text>
    <text x="110" y="364" font-weight="700" fill="#5eead4">SYSTEM PROFILE</text>
    <text x="110" y="407" fill="#94a3b8">Operating system</text><text x="390" y="407">linux</text>
    <text x="110" y="442" fill="#94a3b8">Logical CPUs</text><text x="390" y="442">8</text>
    <text x="110" y="477" fill="#94a3b8">Total RAM</text><text x="390" y="477">15.62 GiB</text>
    <text x="110" y="512" fill="#94a3b8">Available RAM</text><text x="390" y="512">11.87 GiB</text>
    <text x="110" y="547" fill="#94a3b8">GPU</text><text x="390" y="547">not detected; CPU-only planning will be used</text>
  </g>
</svg>
